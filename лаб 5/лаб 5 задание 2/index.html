<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверка пароля</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #eef1f6;
      color: #1d2433;
    }
    .box {
      width: min(400px, 92vw);
      background: #fff;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(20, 30, 60, .12);
    }
    h1 { margin: 0 0 18px; font-size: 22px; }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border: 1.5px solid #c5ccdb;
      border-radius: 8px;
    }
    input:focus-visible { outline: 2px solid #3b6cf6; border-color: #3b6cf6; }
    .show { display: block; margin: 10px 0 16px; font-size: 14px; }
    h2 { font-size: 15px; margin: 0 0 8px; }
    #requirements { list-style: none; margin: 0 0 16px; padding: 0; }
    #requirements li { padding: 6px 0 6px 28px; position: relative; color: #8a2d2d; }
    #requirements li::before { content: "✕"; position: absolute; left: 4px; font-weight: bold; }
    #requirements li.ok { color: #1c7a3d; }
    #requirements li.ok::before { content: "✓"; }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #3b6cf6;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #2a56d6; }
    #message { margin-top: 16px; padding: 12px; border-radius: 8px; min-height: 20px; }
    #message.success { background: #e6f5ea; color: #1c7a3d; }
    #message.fail { background: #fdeaea; color: #b3261e; }
  </style>
</head>
<body>
  <main class="box">
    <h1>Проверка пароля</h1>

    <input type="password" id="password" placeholder="Введите пароль" autocomplete="off">
    <label class="show">
      <input type="checkbox" id="toggle"> Показать пароль
    </label>

    <h2>Требования к паролю</h2>
    <ul id="requirements"></ul>

    <button id="check">Проверить</button>
    <div id="message" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
