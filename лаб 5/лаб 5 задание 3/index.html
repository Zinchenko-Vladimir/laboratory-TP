<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список задач</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #eef1f6;
      color: #1d2433;
    }
    .app {
      width: min(480px, 100%);
      height: fit-content;
      background: #fff;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(20, 30, 60, .12);
    }
    h1 { margin: 0 0 18px; font-size: 22px; }
    .add { display: flex; gap: 8px; }
    .add input {
      flex: 1;
      padding: 10px 12px;
      font-size: 16px;
      border: 1.5px solid #c5ccdb;
      border-radius: 8px;
    }
    .add input:focus-visible { outline: 2px solid #3b6cf6; border-color: #3b6cf6; }
    .add button {
      padding: 10px 16px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #3b6cf6;
      color: #fff;
      cursor: pointer;
    }
    .add button:hover { background: #2a56d6; }
    #error { min-height: 20px; margin: 6px 0 0; font-size: 13px; color: #b3261e; }
    .stats { display: flex; gap: 16px; margin: 12px 0; font-size: 14px; color: #4a5470; }
    #tasks { list-style: none; margin: 0; padding: 0; }
    #tasks li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid #e3e7f0;
    }
    #tasks li span { flex: 1; word-break: break-word; }
    #tasks li.done span { text-decoration: line-through; color: #8a93a8; }
    #tasks input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .del {
      border: none;
      background: none;
      color: #b3261e;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .del:hover { background: #fdeaea; }
    .empty { color: #8a93a8; text-align: center; padding: 18px 0; }
  </style>
</head>
<body>
  <main class="app">
    <h1>Список задач</h1>

    <div class="add">
      <input type="text" id="taskInput" placeholder="Новая задача" maxlength="120">
      <button id="addBtn">Добавить</button>
    </div>
    <div id="error" aria-live="polite"></div>

    <div class="stats">
      <span>Выполнено: <b id="doneCount">0</b></span>
      <span>Не выполнено: <b id="todoCount">0</b></span>
    </div>

    <ul id="tasks"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
