<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини-калькулятор</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #eef1f6;
      color: #1d2433;
    }
    .calc {
      width: min(380px, 92vw);
      background: #fff;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(20, 30, 60, .12);
    }
    h1 { margin: 0 0 20px; font-size: 22px; }
    label { display: block; font-size: 14px; margin-bottom: 14px; }
    input {
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      font-size: 16px;
      border: 1.5px solid #c5ccdb;
      border-radius: 8px;
    }
    input:focus { outline: 2px solid #3b6cf6; border-color: #3b6cf6; }
    .ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0 18px; }
    .op {
      padding: 12px 0;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      background: #3b6cf6;
      color: #fff;
      cursor: pointer;
    }
    .op:hover { background: #2a56d6; }
    .op:focus-visible { outline: 3px solid #1d2433; outline-offset: 2px; }
    #result {
      min-height: 52px;
      padding: 14px;
      border-radius: 8px;
      background: #f3f5fa;
      font-size: 18px;
      word-break: break-all;
    }
    #result.error { background: #fdeaea; color: #b3261e; }
  </style>
</head>
<body>
  <main class="calc">
    <h1>Мини-калькулятор</h1>

    <label>Первое число
      <input type="number" id="num1" step="any" placeholder="Например, 12">
    </label>

    <label>Второе число
      <input type="number" id="num2" step="any" placeholder="Например, 4">
    </label>

    <div class="ops">
      <button class="op" data-op="+" title="Сложение">+</button>
      <button class="op" data-op="-" title="Вычитание">−</button>
      <button class="op" data-op="*" title="Умножение">×</button>
      <button class="op" data-op="/" title="Деление">÷</button>
    </div>

    <div id="result" aria-live="polite">Введите числа и выберите действие</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
