<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список покупок</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Список покупок</h1>
  <form id="form">
    <input id="name" type="text" placeholder="Например: молоко" maxlength="60" autocomplete="off">
    <button type="submit">Добавить</button>
  </form>
  <p id="error" class="error" role="alert"></p>
  <ul id="list"></ul>
  <p id="empty" class="empty">Список пуст. Добавьте первый товар.</p>
  <button id="clear" class="danger">Очистить список</button>
  <script src="app.js"></script>
</body>
</html>
