<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список задач</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Список задач</h1>

    <form id="add-form" class="add" novalidate>
      <label class="sr" for="task-input">Новая задача</label>
      <input id="task-input" placeholder="Что нужно сделать?" maxlength="100" autocomplete="off">
      <button type="submit" class="primary">Добавить</button>
    </form>
    <p id="error" class="error" role="alert"></p>

    <nav class="tabs" aria-label="Фильтр задач">
      <button class="tab" data-tab="all">Все <span class="count" id="count-all">0</span></button>
      <button class="tab" data-tab="active">Активные <span class="count" id="count-active">0</span></button>
      <button class="tab" data-tab="done">Выполненные <span class="count" id="count-done">0</span></button>
    </nav>

    <ul id="list" class="list" aria-live="polite"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
