<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вариант 18: параллельная загрузка Promise.all</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <h1>Публикации по пользователям</h1>
      <p>Пользователи и публикации загружаются одновременно, затем считается число публикаций у каждого</p>
    </header>
    <div class="content">
      <div class="controls">
        <button id="load" type="button">Загрузить данные</button>
        <button id="retry" type="button" hidden>Повторить</button>
      </div>
      <p id="status" role="status"></p>
      <div id="summary" class="summary"></div>
      <ul id="results"></ul>
    </div>
  </main>
</body>
</html>
