<!doctype html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор скидки</title>
<link rel="stylesheet" href="./styles/style.css"></head>
<body>
<main class="card">
  <h1>Калькулятор скидки</h1>
  <label>Цена, ₸ <input id="price" type="number" min="0" step="0.01"></label>
  <label>Скидка, % <input id="percent" type="number" min="0" max="100" step="0.1"></label>
  <div class="row">
   <button id="calculate">Рассчитать</button>
   <button id="reset" class="secondary">Сбросить</button>
  </div>
  <p id="result" aria-live="polite"></p>
 </main>
 <script type="module" src="./src/main.js"></script>
<script>
 /* Запасной вариант: при открытии двойным щелчком (file://) браузер блокирует ES-модули,
    поэтому подключается dist/bundle.js (те же модули, собранные в один файл).
    Через http:// работают настоящие ES-модули из src/. */
 if (location.protocol === "file:") {
  var s = document.createElement("script");
  s.src = "./dist/bundle.js";
  document.body.appendChild(s);
 }
</script>

</body></html>
